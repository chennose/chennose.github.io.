<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>加拿大自助旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F1EA;
    --paper-raised:#FFFFFF;
    --ink:#1D2321;
    --ink-soft:rgba(29,35,33,.62);
    --ink-faint:rgba(29,35,33,.38);
    --line:rgba(29,35,33,.13);
    --accent:#B14328;
    --accent-soft:rgba(177,67,40,.09);
    --accent-ink:#FFFFFF;
    --shadow: 0 1px 2px rgba(29,35,33,.06);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper:#15181A;
      --paper-raised:#1D2224;
      --ink:#EDEBE4;
      --ink-soft:rgba(237,235,228,.64);
      --ink-faint:rgba(237,235,228,.38);
      --line:rgba(237,235,228,.14);
      --accent:#E07A5A;
      --accent-soft:rgba(224,122,90,.14);
      --accent-ink:#1A1310;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --paper:#15181A;
    --paper-raised:#1D2224;
    --ink:#EDEBE4;
    --ink-soft:rgba(237,235,228,.64);
    --ink-faint:rgba(237,235,228,.38);
    --line:rgba(237,235,228,.14);
    --accent:#E07A5A;
    --accent-soft:rgba(224,122,90,.14);
    --accent-ink:#1A1310;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC","Noto Sans",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  .serif{ font-family:"Noto Serif TC","Noto Serif",serif; }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:var(--paper);
  }

  .masthead{ padding:22px 20px 14px; border-bottom:1px solid var(--line); }
  .masthead .kicker{ font-size:11px; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:4px; }
  .masthead h1{ margin:0; font-size:22px; font-weight:600; letter-spacing:.01em; }
  .masthead .range{ margin-top:3px; font-size:13px; color:var(--ink-soft); }

  .rail-wrap{ position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line); }
  .rail{ display:flex; gap:6px; overflow-x:auto; padding:10px 14px; scrollbar-width:none; }
  .rail::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft);
    border-radius:10px; padding:6px 11px; font-size:12.5px; line-height:1.25; text-align:center;
    cursor:pointer; user-select:none; transition:border-color .15s ease, color .15s ease, background .15s ease; white-space:nowrap;
  }
  .pill .p-num{ display:block; font-size:9.5px; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:1px;}
  .pill.active{ border-color:var(--accent); color:var(--ink); background:var(--accent-soft); }
  .pill.active .p-num{ color:var(--accent); }

  .subnav{ display:flex; align-items:center; justify-content:space-between; padding:8px 16px 10px; gap:10px; }
  .navbtn{
    border:1px solid var(--line); background:var(--paper-raised); color:var(--ink);
    width:34px;height:34px; border-radius:9px; display:flex;align-items:center;justify-content:center; cursor:pointer; flex:0 0 auto;
  }
  .navbtn:disabled{ opacity:.3; cursor:default; }
  .navbtn svg{ width:16px; height:16px; }
  .progress-text{ font-size:12px; color:var(--ink-faint); text-align:center; flex:1; }

  .content{ flex:1; padding:6px 18px 60px; }
  .page{ animation:fade .22s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .day-head{ padding:14px 0 10px; }
  .day-head .d-num{ font-size:13px; color:var(--accent); font-weight:600; letter-spacing:.04em; }
  .day-head h2{ margin:2px 0 4px; font-size:26px; font-weight:600; line-height:1.15; }
  .day-head .d-meta{ font-size:13px; color:var(--ink-soft); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tag{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:100px; background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .tag.plain{ background:transparent; border:1px solid var(--line); color:var(--ink-soft); font-weight:500; }

  .ticket{ border:1px solid var(--line); border-radius:14px; background:var(--paper-raised); padding:14px 16px; margin:10px 0 16px; box-shadow:var(--shadow); }
  .ticket-row{ display:flex; align-items:center; gap:10px; }
  .ticket-icon{ width:30px;height:30px; border-radius:8px; background:var(--accent-soft); color:var(--accent); display:flex;align-items:center;justify-content:center; flex:0 0 auto; }
  .ticket-icon svg{ width:16px;height:16px; }
  .ticket-main{ flex:1; min-width:0; }
  .ticket-main .t-title{ font-size:14.5px; font-weight:600; }
  .ticket-main .t-sub{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .ticket-extra{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  .ticket-extra ul{ margin:0; padding-left:18px; }
  .ticket-extra li{ margin-bottom:4px; }

  /* time / place table */
  table.ttable{ width:100%; border-collapse:collapse; margin-top:10px; }
  table.ttable td{ padding:7px 4px; border-top:1px solid var(--line); vertical-align:top; font-size:13px; line-height:1.5; }
  table.ttable tr:first-child td{ border-top:none; padding-top:2px; }
  table.ttable td.tt-time{ width:52px; white-space:nowrap; color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; padding-right:10px; }
  table.ttable td.tt-place{ font-weight:600; color:var(--ink); }
  table.ttable td.tt-text{ color:var(--ink-soft); }
  .leg-caption{ margin-top:8px; font-size:11.5px; color:var(--ink-faint); }

  section.block{ margin-bottom:20px; }
  section.block h3{ font-size:12px; font-weight:700; letter-spacing:.03em; color:var(--ink-faint); margin:0 0 8px; display:flex; align-items:center; gap:6px; }
  section.block h3 svg{ width:13px;height:13px; opacity:.75; }
  .list{ margin:0; padding:0; list-style:none; }
  .list li{ position:relative; padding-left:14px; margin-bottom:8px; font-size:14px; line-height:1.55; color:var(--ink); }
  .list li::before{ content:""; position:absolute; left:0; top:8px; width:4px;height:4px; border-radius:50%; background:var(--accent); }
  a.maplink{ color:var(--ink); text-decoration:none; border-bottom:1px dotted var(--accent); padding-bottom:1px; }
  a.maplink:active{ opacity:.7; }
  a.maplink svg{ width:11px;height:11px; margin-left:3px; vertical-align:-1px; color:var(--accent); flex:0 0 auto; }

  details.disclose{ border:1px solid var(--line); border-radius:12px; background:var(--paper-raised); padding:2px 14px; }
  details.disclose + details.disclose{ margin-top:8px; }
  details.disclose summary{ cursor:pointer; list-style:none; padding:11px 0; font-size:13.5px; font-weight:600; color:var(--ink); display:flex; align-items:center; justify-content:space-between; }
  details.disclose summary::-webkit-details-marker{ display:none; }
  details.disclose summary .chev{ width:9px;height:9px; border-right:1.6px solid var(--ink-faint); border-bottom:1.6px solid var(--ink-faint); transform:rotate(-45deg); transition:transform .18s ease; flex:0 0 auto; }
  details.disclose[open] summary .chev{ transform:rotate(45deg); }
  details.disclose .disclose-body{ padding:0 0 14px; font-size:13px; line-height:1.6; color:var(--ink-soft); }

  .stay-card{ border:1px solid var(--line); border-radius:14px; padding:14px 16px; background:var(--paper-raised); }
  .stay-card .s-city{ font-size:11.5px; color:var(--ink-faint); margin-bottom:2px;}
  .stay-card .s-name{ font-size:15px; font-weight:600; margin-bottom:6px; line-height:1.4;}
  .stay-card .s-row{ font-size:13px; color:var(--ink-soft); display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-top:1px solid var(--line); }
  .stay-card .s-row:first-of-type{ border-top:none; padding-top:0; }
  .stay-card .s-row b{ color:var(--ink); font-weight:600; }

  .foot-note{ text-align:center; font-size:11.5px; color:var(--ink-faint); padding:20px 0 4px; }

  .info-group{ margin-bottom:22px; }
  .info-group h3{ font-size:12px; font-weight:700; letter-spacing:.03em; color:var(--ink-faint); margin:0 0 8px; }
  .info-row{ display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-top:1px solid var(--line); font-size:13.5px; }
  .info-row:first-child{ border-top:none; }
  .info-row .k{ color:var(--ink-soft); flex:0 0 auto; max-width:56%; }
  .info-row .v{ color:var(--ink); text-align:right; font-weight:500; }

  .hero-inner{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:20px 4px 6px; }
  .hero-kicker{ font-size:11px; letter-spacing:.14em; color:var(--ink-faint); margin-bottom:14px; }
  .hero-title{ font-size:42px; line-height:1.18; font-weight:700; margin:0 0 12px; letter-spacing:.01em; }
  .hero-dates{ font-size:13.5px; color:var(--accent); font-weight:600; letter-spacing:.06em; margin-bottom:26px; }
  .hero-map{ width:100%; max-width:320px; height:auto; margin-bottom:8px; }
  .hero-map .city-label{ font-size:9.5px; fill:var(--ink-faint); font-family:"Noto Sans TC",sans-serif; }
  .hero-map .city-code{ font-size:10.5px; fill:var(--ink); font-weight:600; font-family:"Noto Sans TC",sans-serif; }
  .hero-map .route-line{ stroke:var(--line); stroke-width:1.4; stroke-dasharray:3 4; }
  .hero-map .route-dot{ fill:var(--paper-raised); stroke:var(--accent); stroke-width:1.6; }
  .hero-stats{ display:flex; gap:30px; margin:22px 0 26px; }
  .hero-stats .stat{ display:flex; flex-direction:column; align-items:center; }
  .hero-stats .stat b{ font-family:"Noto Serif TC",serif; font-size:23px; font-weight:700; color:var(--ink); line-height:1.2; }
  .hero-stats .stat span{ font-size:10.5px; color:var(--ink-faint); margin-top:2px; }
  .hero-divider{ width:34px; height:1px; background:var(--line); margin:0 0 22px; }
  .hero-route{ font-size:12.5px; color:var(--ink-soft); line-height:1.9; padding:0 10px; margin-bottom:28px; }
  .hero-cta{
    border:none; background:var(--ink); color:var(--paper); padding:13px 30px; border-radius:100px; font-size:14px; font-weight:600;
    font-family:"Noto Sans TC",sans-serif; letter-spacing:.02em; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .hero-cta:active{ opacity:.8; }
  .hero-cta svg{ width:14px; height:14px; }

  @media (min-width:481px){ .app{ border-left:1px solid var(--line); border-right:1px solid var(--line); } }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="masthead">
    <div class="kicker">TRAVEL ITINERARY</div>
    <h1 class="serif">加拿大自助旅行</h1>
    <div class="range">2026.09.28 — 10.16　溫哥華・維多利亞・蒙特婁・魁北克・多倫多・尼加拉瀑布</div>
  </div>

  <div class="rail-wrap">
    <div class="rail" id="rail"></div>
    <div class="subnav">
      <button class="navbtn" id="prevBtn" aria-label="前一天">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="progress-text" id="progressText"></div>
      <button class="navbtn" id="nextBtn" aria-label="下一天">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="content" id="content"></div>

</div>

<script>
const ICONS = {
  plane: `<svg viewBox="0 0 24 24" fill="none"><path d="M10.5 14.5L4 12.7c-.6-.2-.6-1 0-1.3l1.6-.8 6 1.5 3-3-8-4 1.7-1.2c.4-.3.9-.3 1.3 0l9 5.6 3.6-1c1-.3 2 .6 1.7 1.6l-1 3.6-9 5.6-2.5 3-1.6.4-.4-3.3 2.5-3z" fill="currentColor"/></svg>`,
  train: `<svg viewBox="0 0 24 24" fill="none"><rect x="6" y="3" width="12" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M6 12h12M9 17l-2 3M15 17l2 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="8" r=".9" fill="currentColor"/><circle cx="15" cy="8" r=".9" fill="currentColor"/></svg>`,
  car: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 16l1.2-5.2A2 2 0 017.1 9.3h9.8a2 2 0 011.9 1.5L20 16" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><rect x="3" y="16" width="18" height="4" rx="1.4" stroke="currentColor" stroke-width="1.8"/><circle cx="7.5" cy="20" r="1.3" fill="currentColor"/><circle cx="16.5" cy="20" r="1.3" fill="currentColor"/></svg>`,
  boat: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 15l1.5 4.2a2 2 0 001.9 1.3h9.2a2 2 0 001.9-1.3L20 15H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 15V6h5l3 5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 6H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  walk: `<svg viewBox="0 0 24 24" fill="none"><circle cx="13" cy="4.5" r="1.6" fill="currentColor"/><path d="M10 22l1.5-6-2-2 .7-5 3-1.2 2.6 2.4 2.7 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.5 14l-3 2-2 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  pin: `<svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.7 7-12a7 7 0 10-14 0c0 5.3 7 12 7 12z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9" r="2.3" stroke="currentColor" stroke-width="1.8"/></svg>`,
  bed: `<svg viewBox="0 0 24 24" fill="none"><path d="M3 18v-8a2 2 0 012-2h14a2 2 0 012 2v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 15h18M3 18l-1 3M21 18l1 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5 10V8a2 2 0 012-2h3a2 2 0 012 2v2M13 10V9a2 2 0 012-2h2a2 2 0 012 2v1" stroke="currentColor" stroke-width="1.8"/></svg>`,
  cart: `<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="20" r="1.3" fill="currentColor"/><circle cx="17" cy="20" r="1.3" fill="currentColor"/><path d="M3 4h2l2.2 11.2a2 2 0 002 1.6h7.4a2 2 0 002-1.6L20 8H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  food: `<svg viewBox="0 0 24 24" fill="none"><path d="M7 3v7a2 2 0 002 2v9M7 3v7M9 3v7M7 10h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 3c-1.7 0-3 2-3 5s1.3 5 3 5v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  note: `<svg viewBox="0 0 24 24" fill="none"><path d="M6 3h9l3 3v15H6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15 3v3h3M9 12h6M9 16h6M9 8h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  extlink: `<svg viewBox="0 0 24 24" fill="none"><path d="M14 5h5v5M19 5l-8 8M8 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};

function mapsUrl(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }
function renderSights(sights){
  if(!sights) return '';
  if(typeof sights === 'string'){
    const arr = items(sights);
    if(!arr.length) return '';
    return `<section class="block"><h3>${ICONS.pin}今日重點</h3><ul class="list">${arr.map(t=>`<li>${t}</li>`).join('')}</ul></section>`;
  }
  if(!sights.length) return '';
  return `<section class="block"><h3>${ICONS.pin}今日重點</h3><ul class="list">${sights.map(s=>
    s.q ? `<li><a class="maplink" href="${mapsUrl(s.q)}" target="_blank" rel="noopener">${s.t}${ICONS.extlink}</a></li>` : `<li>${s.t}</li>`
  ).join('')}</ul></section>`;
}

function items(str){
  if(!str) return [];
  return str.split('@').map(s=>s.trim()).filter(Boolean);
}
function modeIcon(mode){ return ICONS[mode] || ICONS.pin; }
function modeLabel(mode){ return {plane:'搭機',train:'搭火車',car:'租車',boat:'搭船',stay:'市區停留'}[mode] || '交通'; }

/* turn a raw "@"-separated string into time / text rows for a table */
function toTimeRows(raw){
  const list = items(raw);
  if(!list.length) return [];
  return list.map(t=>{
    const m = t.match(/\d{1,2}:\d{2}(?:\s*[\/~～\-–]\s*\d{1,2}:\d{2})*/);
    if(m){
      const time = m[0].replace(/\s+/g,'');
      let text = (t.slice(0,m.index) + t.slice(m.index+m[0].length));
      text = text.replace(/^[，,、\s：:]+|[，,、\s]+$/g,'').trim();
      return {time, text: text || '—'};
    }
    return {time:'', text:t};
  });
}
function renderTTable(rows){
  if(!rows.length) return '';
  return `<table class="ttable"><tbody>${rows.map(r=>`<tr><td class="tt-time">${r.time||'—'}</td><td class="tt-text">${r.text}</td></tr>`).join('')}</tbody></table>`;
}
function renderLegs(legs){
  if(!legs || !legs.length) return '';
  return `<table class="ttable"><tbody>${legs.map(l=>`<tr><td class="tt-time">${l.time||'—'}</td><td class="tt-place">${l.place}</td></tr>`).join('')}</tbody></table>`;
}

/* ============ DATA ============ */
const OUTBOUND = {
  title:'出發', heading:'台灣 → 溫哥華', sub:'2026.09.28　三段不同航班分批出發',
  flights:[
    {who:'吉偉', carrier:'長榮航空 → 加拿大航空', caption:'全程約 17h15m',
      legs:[{time:'07:00',place:'高雄 KHH'},{time:'—',place:'成田 NRT（轉機，5h5m）'},{time:'09:15',place:'溫哥華 YVR'}]},
    {who:'（本團）', carrier:'國泰航空 CX461 / CX810', caption:'全程約 15h35m',
      legs:[{time:'12:00',place:'台北 TPE（第2航廈）'},{time:'15:55',place:'香港 HKG（轉機）'},{time:'12:35',place:'溫哥華 YVR'}]},
    {who:'（本團）', carrier:'長榮航空 BR10', caption:'全程約 10h45m・直飛',
      legs:[{time:'23:30',place:'台北 TPE（第2航廈）'},{time:'19:15',place:'溫哥華 YVR（國內航廈）'}]}
  ]
};
const RETURN_TRIP = {
  title:'返程', heading:'多倫多 → 台灣', sub:'2026.10.16　三段不同航班分批返程',
  flights:[
    {who:'（本團）', carrier:'國泰航空 CX829 / CX422', caption:'全程約 19h5m',
      legs:[{time:'01:50',place:'多倫多 YYZ（第3航廈）'},{time:'07:10',place:'香港 HKG（轉機）'},{time:'08:55',place:'台北 TPE'}]},
    {who:'（本團）', carrier:'長榮航空 BR35', caption:'全程約 15h55m・直飛',
      legs:[{time:'01:45',place:'多倫多 YYZ（第1航廈）'},{time:'05:40',place:'台北 TPE'}]},
    {who:'吉偉', carrier:'加拿大航空 → 國泰航空', caption:'全程約 25h40m・10/18 抵達',
      legs:[{time:'20:30',place:'多倫多 YYZ'},{time:'—',place:'溫哥華 YVR（轉機，2h4m）'},{time:'—',place:'香港 HKG（轉機，3h20m）'},{time:'10:10',place:'高雄 KHH（10/18）'}]}
  ]
};

const DAYS = [
{ day:1, date:'9/28', weekday:'', city:'溫哥華', cityEn:'Vancouver', mode:'plane', holiday:null,

const pages = [];
pages.push({type:'home'});
pages.push({type:'flight', data:OUTBOUND});
DAYS.forEach(d=>pages.push({type:'day', data:d}));
pages.push({type:'flight', data:RETURN_TRIP});
pages.push({type:'info'});

let current = 0;

const rail = document.getElementById('rail');
function railLabel(p){
  if(p.type==='home') return `<span class="p-num">HOME</span>首頁`;
  if(p.type==='flight') return `<span class="p-num">${p.data.title==='出發'?'START':'END'}</span>${p.data.title}`;
  if(p.type==='info') return `<span class="p-num">INFO</span>資訊`;
  return `<span class="p-num">D${String(p.data.day).padStart(2,'0')}</span>${p.data.date}`;
}
pages.forEach((p,i)=>{
  const el = document.createElement('div');
  el.className = 'pill';
  el.dataset.idx = i;
  el.innerHTML = railLabel(p);
  el.addEventListener('click', ()=>go(i));
  rail.appendChild(el);
});

const content = document.getElementById('content');

function sectionList(label, iconKey, raw){
  const arr = items(raw);
  if(!arr.length) return '';
  return `<section class="block"><h3>${ICONS[iconKey]||''}${label}</h3><ul class="list">${arr.map(t=>`<li>${t}</li>`).join('')}</ul></section>`;
}

      </div>
    </div>`;

  if(isTravel && (d.legs || d.transportCaption)){
    html += `
    <div class="ticket">
      <div class="ticket-row">
        <div class="ticket-icon">${modeIcon(d.mode)}</div>
        <div class="ticket-main">
          <div class="t-title">${modeLabel(d.mode)}</div>
          ${d.transportCaption?`<div class="t-sub">${d.transportCaption}</div>`:''}
        </div>
      </div>
      ${renderLegs(d.legs)}
      ${d.prep? `<div class="ticket-extra"><ul>${items(d.prep).map(t=>`<div>・${t}</div>`).join('')}</ul></div>`:''}
    </div>`;
  } else if(d.prep){
    html += `<div class="ticket"><div class="ticket-extra" style="margin-top:0;padding-top:0;border-top:none;">${items(d.prep).map(t=>`<div>・${t}</div>`).join('')}</div></div>`;
  }

  html += renderSights(d.sights);

  if(hasTransitDetail){
    html += `<section class="block"><h3>${ICONS.walk}交通指南</h3>`;
    if(d.arrivalTransit){
      html += `<details class="disclose"><summary>抵達交通 <span class="chev"></span></summary><div class="disclose-body">${renderTTable(toTimeRows(d.arrivalTransit))}</div></details>`;
    }
    if(d.transit1 || d.transit2){
      const combined = [d.transit1, d.transit2].filter(Boolean).join('@');
      html += `<details class="disclose"><summary>景點間交通 <span class="chev"></span></summary><div class="disclose-body">${renderTTable(toTimeRows(combined))}</div></details>`;
    }
    html += `</section>`;
  }

  if(d.hotel){
    let nameHtml = d.hotel.replace(/\n/g,'<br>');
    if(d.hotelQ2){
      const parts = d.hotel.split('／');
      if(parts.length===2){
        nameHtml = `<a class="maplink" href="${mapsUrl(d.hotelQ)}" target="_blank" rel="noopener">${parts[0]}${ICONS.extlink}</a>／<a class="maplink" href="${mapsUrl(d.hotelQ2)}" target="_blank" rel="noopener">${parts[1]}${ICONS.extlink}</a>`;
      }
    } else if(d.hotelQ){
      nameHtml = `<a class="maplink" href="${mapsUrl(d.hotelQ)}" target="_blank" rel="noopener">${nameHtml}${ICONS.extlink}</a>`;
    }
    html += `
    <section class="block">
      <h3>${ICONS.bed}住宿</h3>
      <div class="stay-card">
        <div class="s-city">${d.stayCity}</div>
        <div class="s-name">${nameHtml}</div>
        ${d.price?`<div class="s-row"><span>費用</span><b>${d.price}</b></div>`:''}
        ${d.note?`<div class="s-row"><span>備註</span><b>${d.note}</b></div>`:''}
      </div>
    </section>`;
  }

  html += sectionList('生活機能', 'cart', d.market);
  html += sectionList('美食推薦', 'food', d.food);
  html += sectionList('小提醒', 'note', d.extra);

  html += `</div>`;
  return html;
}

function render(idx){
  const p = pages[idx];
  let html;
  if(p.type==='home') html = renderHome();
  else if(p.type==='flight') html = renderFlightPage(p);
  else if(p.type==='info') html = renderInfoPage();
  else html = renderDayPage(p);
  content.innerHTML = html;

  [...rail.children].forEach((el,i)=>{
    el.classList.toggle('active', i===idx);
    if(i===idx) el.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  });

  document.getElementById('prevBtn').disabled = idx===0;
  document.getElementById('nextBtn').disabled = idx===pages.length-1;
  document.getElementById('progressText').textContent = `${idx+1} / ${pages.length}`;
  content.scrollTop = 0;
}

function go(idx){
  if(idx<0||idx>=pages.length) return;
  current = idx;
  render(current);
}

document.getElementById('prevBtn').addEventListener('click', ()=>go(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>go(current+1));

content.addEventListener('click', e=>{
  if(e.target.closest('#startBtn')) go(1);
});

let touchStartX = null, touchStartY = null, touchStartScrollTop = 0;
content.addEventListener('touchstart', e=>{
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartScrollTop = content.scrollTop;
}, {passive:true});
content.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const scrolled = Math.abs(content.scrollTop - touchStartScrollTop) > 4;
  // only treat as a page-swipe when the gesture is clearly horizontal
  // and the content area itself didn't scroll vertically during the touch
  if(!scrolled && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8){
    if(dx < 0) go(current+1); else go(current-1);
  }
  touchStartX = null; touchStartY = null;
}, {passive:true});

window.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') go(current+1);
  if(e.key==='ArrowLeft') go(current-1);
});

render(current);
</script>
</body>
</html>
